# Netlify hosts the web app. Requests to /api are passed on to the backend (Render),
# so the sign-in cookie stays on the same site as the app.
# Replace YOUR-BACKEND with your Render service name, for example koin-api.onrender.com
[build]
  base = "web"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_REALTIME_URL = "https://koin-jyvc.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "https://koin-jyvc.onrender.com/api/:splat"
  status = 200
  force = true
