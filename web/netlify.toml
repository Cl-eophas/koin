[build]
  base = "web"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_REALTIME_URL = "https://koin-jyvc.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/*"
  to = "https://koin-jyvc.onrender.com/api/:splat"
  status = 200
  force = true
