# Runs on every push and pull request. If any step fails, the change is flagged
# before it reaches Netlify or Render.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm test
      - name: Check the server file is valid
        run: node --check server.js

  web:
    name: Web type-check, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
        env:
          NEXT_PUBLIC_REALTIME_URL: https://koin-jyvc.onrender.com

  config:
    name: Config files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No placeholder addresses left
        run: |
          if grep -rn "YOUR-BACKEND" web/netlify.toml render.yaml; then
            echo "Placeholder address found. Replace it with the real backend address."
            exit 1
          fi
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo ".env must never be committed."
            exit 1
          fi
